[package]
name = "pocketplay"
version = "1.0.0"
edition = "2021"
description = "Native Rust Android desktop controller"
license = "MIT"

[features]
qa = []

[dependencies]
anyhow = "1"
eframe = { version = "0.33.0", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

